name: Test OpenCL module and advanced example

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - name: Check out pinned Vulkan module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: .ci-modules/vulkan
      - name: Check out pinned GLFW module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: .ci-modules/glfw
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd libvulkan-dev libvulkan-volk-dev libglfw3-dev mesa-vulkan-drivers vulkan-validationlayers libx11-dev openbox xauth xvfb glslc
      - name: Verify the published module and run installed-package tests
        run: v run tools/ci_published.vsh smoke
      - name: Build and test Vulkan particles example
        env:
          VULKAN_SDK: /usr
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
          VULKAN_REF: ${{ steps.compat.outputs.module_vulkan }}
          GLFW_REF: ${{ steps.compat.outputs.module_glfw }}
        run: v run tools/ci_published.vsh particles

  macos-abi-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Assemble namespaced module and compile macOS ABI probes
        run: v run tools/ci_published.vsh macos-abi

  linux-v-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # V master currently builds a separate v1_fallback executable for tool
      # commands such as `v test`. Keep the complete source build together;
      # setup-v-action@v4's reduced cache bundle omits that executable.
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - name: Check out V master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout_v_master
        continue-on-error: true
        with:
          repository: vlang/v
          path: .ci-v-master
          fetch-depth: 1
      - name: Build V master
        id: setup_v_master
        if: steps.checkout_v_master.outcome == 'success'
        continue-on-error: true
        run: v run tools/ci_published.vsh build-master
      - name: Install OpenCL runtime and headers
        if: steps.setup_v_master.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Run correctness smoke tests on V master
        id: test_v_master
        if: steps.setup_v_master.outcome == 'success'
        continue-on-error: true
        run: v run tools/ci_published.vsh smoke-master
      - name: Report V master compatibility warning
        if: always() && (steps.checkout_v_master.outcome == 'failure' || steps.setup_v_master.outcome == 'failure' || steps.test_v_master.outcome == 'failure')
        run: echo "::warning::The live V master compatibility lane failed; stable V 0.5.2 and the pinned V3 frontend remain authoritative."

  strict-v3-frontend:
    name: Strict V3 frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - name: Check out pinned V3 compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v3_v }}
          path: .ci-v3
          fetch-depth: 1
      - name: Check out matching V3 bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.v3_vc }}
          path: .ci-v3/vc
          fetch-depth: 1
      - name: Check out matching V3 TinyCC runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.v3_tcc }}
          path: .ci-v3/thirdparty/tcc
          fetch-depth: 1
      - name: Build pinned V3 compiler
        run: v run tools/ci_published.vsh build-strict
      - name: Install OpenCL runtime and headers
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Assemble module and require strict frontend compatibility
        run: v run tools/ci_published.vsh strict-frontend
      - name: Run V3 backend smoke tests with TinyCC
        run: v run tools/ci_published.vsh strict-smoke

  windows-abi-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Install OpenCL SDK
        run: vcpkg install opencl:x64-windows
      - name: Assemble namespaced module and compile Windows ABI probes
        run: v run tools/ci_published.vsh windows-abi

  linux-dependency-master:
    name: Advisory Vulkan and GLFW master
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: master
          path: .ci-modules/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: master
          path: .ci-modules/glfw
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd libvulkan-dev libvulkan-volk-dev libglfw3-dev
      - name: Assemble modules and compile particles
        run: v run tools/ci_published.vsh dependency-master

  required-checks:
    name: required-checks
    if: always()
    needs: [test, strict-v3-frontend, linux-v-master, macos-abi-compile, windows-abi-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported CI lane to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          V3_RESULT: ${{ needs.strict-v3-frontend.result }}
          V_MASTER_RESULT: ${{ needs.linux-v-master.result }}
          MACOS_RESULT: ${{ needs.macos-abi-compile.result }}
          WINDOWS_RESULT: ${{ needs.windows-abi-compile.result }}
        run: |
          for result in "$TEST_RESULT" "$V3_RESULT" "$V_MASTER_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            test "$result" = success
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: required-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run tools/ci_published.vsh compatibility
      - name: Verify generator provenance and publish the module release
        env:
          GH_TOKEN: ${{ github.token }}
        run: v run tools/ci_published.vsh publish-release
