name: Test OpenCL module and advanced example

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the required compiler so release artifacts moving with V development
  # cannot destabilize the supported lane.
  V_VERSION: 0.5.2
  VULKAN_COMMIT: cd304bc19fd2a669d29b2d1a7975d55ee3b61952
  GLFW_COMMIT: 3d7c1ddacb7215a7bbeb5fef0d7a68c90ba392ed

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned Vulkan module
        uses: actions/checkout@v7
        with:
          repository: antono2/vulkan
          ref: ${{ env.VULKAN_COMMIT }}
          path: .ci-modules/vulkan
      - name: Check out pinned GLFW module
        uses: actions/checkout@v7
        with:
          repository: antono2/glfw
          ref: ${{ env.GLFW_COMMIT }}
          path: .ci-modules/glfw
      - name: Validate generator provenance marker
        run: |
          generator_commit=$(cat GENERATOR_COMMIT)
          [[ "$generator_commit" =~ ^[0-9a-f]{40}$ ]]
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd libvulkan-dev libvulkan-volk-dev libglfw3-dev mesa-vulkan-drivers vulkan-validationlayers xauth xvfb
      - name: Verify the public setup diagnostics
        run: v run setup.vsh --check
      - name: Assemble namespaced module and install example modules
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 opencl.v convenience.v ownership.v program.v event.v image.v svm.v capabilities.v external_interop.v v.mod VERSION LICENSE GENERATOR_COMMIT "$HOME/.vmodules/antono2/opencl/"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
          test "$(git -C .ci-modules/vulkan rev-parse HEAD)" = "$VULKAN_COMMIT"
          test "$(git -C .ci-modules/glfw rev-parse HEAD)" = "$GLFW_COMMIT"
          install -d "$HOME/.vmodules/antono2/vulkan" "$HOME/.vmodules/antono2/glfw"
          cp -a .ci-modules/vulkan/. "$HOME/.vmodules/antono2/vulkan/"
          cp -a .ci-modules/glfw/. "$HOME/.vmodules/antono2/glfw/"
      - name: Run installed-package smoke test
        run: |
          v -cc gcc run test
          v test convenience_test.v
          v test test/pointer_abi_test.v
          v -cc gcc run examples/vector_add
          v -cc gcc run examples/image_svm
      - name: Build and test Vulkan particles example
        env:
          VULKAN_SDK: /usr
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
        run: |
          v -cc gcc -o /tmp/vulkan-particles examples/vulkan_particles
          PARTICLE_COUNT=1024 /tmp/vulkan-particles
          v -cc tcc -o /tmp/vulkan-particles-tcc examples/vulkan_particles
          PARTICLE_COUNT=1024 /tmp/vulkan-particles-tcc
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            xvfb-run -a /tmp/vulkan-particles --staged --frames=16 --particles=1024 \
            2>&1 | tee /tmp/vulkan-particles-window.log
          if grep -E 'Validation (Error|Warning)' /tmp/vulkan-particles-window.log; then
            echo '::error::Vulkan validation reported a particle-renderer synchronization or API error'
            exit 1
          fi
          v test examples/vulkan_particles/options_test.v
          v test examples/vulkan_particles/shader_test.v
          v test examples/vulkan_particles/interop_probe_test.v

  macos-abi-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Assemble namespaced module
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 opencl.v convenience.v ownership.v program.v event.v image.v svm.v capabilities.v external_interop.v v.mod VERSION LICENSE GENERATOR_COMMIT "$HOME/.vmodules/antono2/opencl/"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
      - name: Compile macOS ABI probe
        run: |
          v run setup.vsh --check
          v -cc clang -o /tmp/opencl-abi-probe abi/main.c.v

  linux-v-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # V master currently builds a separate v1_fallback executable for tool
      # commands such as `v test`. Keep the complete source build together;
      # setup-v-action@v4's reduced cache bundle omits that executable.
      - name: Check out V master
        uses: actions/checkout@v7
        id: checkout_v_master
        continue-on-error: true
        with:
          repository: vlang/v
          path: .ci-v-master
          fetch-depth: 1
      - name: Build V master
        id: setup_v_master
        if: steps.checkout_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          make -C .ci-v-master
          echo "$GITHUB_WORKSPACE/.ci-v-master" >> "$GITHUB_PATH"
          .ci-v-master/v -V
      - name: Install OpenCL runtime and headers
        if: steps.setup_v_master.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd
      - name: Assemble namespaced module
        if: steps.setup_v_master.outcome == 'success'
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 opencl.v convenience.v ownership.v program.v event.v image.v svm.v capabilities.v external_interop.v v.mod VERSION LICENSE GENERATOR_COMMIT "$HOME/.vmodules/antono2/opencl/"
      - name: Run correctness smoke tests on V master
        id: test_v_master
        if: steps.setup_v_master.outcome == 'success'
        continue-on-error: true
        run: |
          v -cc gcc run test
          v test convenience_test.v
          v test test/pointer_abi_test.v
          v -cc gcc run examples/vector_add
          v -cc gcc run examples/image_svm
      - name: Report V master compatibility warning
        if: always() && (steps.checkout_v_master.outcome == 'failure' || steps.setup_v_master.outcome == 'failure' || steps.test_v_master.outcome == 'failure')
        run: echo "::warning::The live V master compatibility lane failed; stable V 0.5.2 remains authoritative."

  windows-abi-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ env.V_VERSION }}
      - name: Install OpenCL SDK
        run: vcpkg install opencl:x64-windows
      - name: Assemble namespaced module and compile ABI probe
        shell: pwsh
        run: |
          $module = Join-Path $HOME '.vmodules/antono2/opencl'
          New-Item -ItemType Directory -Force $module | Out-Null
          Copy-Item opencl.v, convenience.v, ownership.v, program.v, event.v, image.v, svm.v, capabilities.v, external_interop.v, v.mod, VERSION, LICENSE, GENERATOR_COMMIT -Destination $module
          $include = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/include'
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/lib'
          $env:OPENCL_SDK = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows'
          v run setup.vsh --check
          v -cc msvc -o "$env:TEMP/opencl-abi-probe.exe" abi/main.c.v

  required-checks:
    name: required-checks
    if: always()
    needs: [test, linux-v-master, macos-abi-compile, windows-abi-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported CI lane to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          V_MASTER_RESULT: ${{ needs.linux-v-master.result }}
          MACOS_RESULT: ${{ needs.macos-abi-compile.result }}
          WINDOWS_RESULT: ${{ needs.windows-abi-compile.result }}
        run: |
          for result in "$TEST_RESULT" "$V_MASTER_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            test "$result" = success
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: required-checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release version and generator provenance
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "version: '$version'" v.mod
          test "$GITHUB_REF_NAME" = "v$version"
          generator_commit=$(cat GENERATOR_COMMIT)
          [[ "$generator_commit" =~ ^[0-9a-f]{40}$ ]]
          generator_tag_refs=$(git ls-remote --exit-code \
            https://github.com/antono2/v_opencl_bindings.git \
            "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          generator_tag_commit=$(printf '%s\n' "$generator_tag_refs" | awk '
            /\^\{\}$/ { peeled = $1 }
            !/\^\{\}$/ { direct = $1 }
            END { print peeled != "" ? peeled : direct }
          ')
          if test "$generator_tag_commit" != "$generator_commit"; then
            echo "::error::v_opencl_bindings $GITHUB_REF_NAME resolves to $generator_tag_commit, expected $generator_commit"
            exit 1
          fi
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "opencl $GITHUB_REF_NAME"
