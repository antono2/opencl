name: Test OpenCL module and advanced example

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: prantlf/setup-v-action@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocl-icd-opencl-dev pocl-opencl-icd libvulkan-dev libvulkan-volk-dev libglfw3-dev mesa-vulkan-drivers xauth xvfb
      - name: Assemble namespaced module and install example modules
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 opencl.v convenience.v ownership.v program.v event.v capabilities.v v.mod VERSION LICENSE "$HOME/.vmodules/antono2/opencl/"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
          v install antono2.vulkan
          v install antono2.glfw
      - name: Run installed-package smoke test
        run: |
          v -cc gcc run test
          v test convenience_test.v
          v -cc gcc run examples/vector_add
      - name: Build and test Vulkan particles example
        env:
          VULKAN_SDK: /usr
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
        run: |
          v -cc gcc -o /tmp/vulkan-particles examples/vulkan_particles
          PARTICLE_COUNT=1024 /tmp/vulkan-particles
          xvfb-run -a /tmp/vulkan-particles --staged --frames=8 --particles=1024
          v test examples/vulkan_particles/options_test.v
          v test examples/vulkan_particles/shader_test.v
          v test examples/vulkan_particles/interop_probe_test.v

  macos-abi-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: prantlf/setup-v-action@v4
      - name: Assemble namespaced module
        run: |
          install -d "$HOME/.vmodules/antono2/opencl"
          install -m 0644 opencl.v convenience.v ownership.v program.v event.v capabilities.v v.mod VERSION LICENSE "$HOME/.vmodules/antono2/opencl/"
          install -d "$HOME/.vmodules/antono2/opencl/include/CL"
          install -m 0644 include/CL/opencl.h "$HOME/.vmodules/antono2/opencl/include/CL/opencl.h"
      - name: Compile macOS ABI probe
        run: v -cc clang -o /tmp/opencl-abi-probe abi/main.c.v

  windows-abi-compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: prantlf/setup-v-action@v4
      - name: Install OpenCL SDK
        run: vcpkg install opencl:x64-windows
      - name: Assemble namespaced module and compile ABI probe
        shell: pwsh
        run: |
          $module = Join-Path $HOME '.vmodules/antono2/opencl'
          New-Item -ItemType Directory -Force $module | Out-Null
          Copy-Item opencl.v, convenience.v, ownership.v, program.v, event.v, capabilities.v, v.mod, VERSION, LICENSE -Destination $module
          $include = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/include'
          $lib = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/lib'
          v -cc msvc -cflags "/I$include" -ldflags "/LIBPATH:$lib" -o "$env:TEMP/opencl-abi-probe.exe" abi/main.c.v

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, macos-abi-compile, windows-abi-compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release version
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "version: '$version'" v.mod
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "opencl $tag"
            git push origin "refs/tags/$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --verify-tag --generate-notes --title "opencl $tag"
